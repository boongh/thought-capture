# Restore validation: proves a backup.sh dump can actually be restored, not
# only that pg_dump exited 0. Run via scripts/restore-test.sh/.ps1, never
# `docker compose` directly - the wrapper tears this stack down through
# scripts/compose-teardown.sh/.ps1 afterward regardless of outcome.
#
#   docker compose --env-file .env -f deploy/compose/backup.restore-test.docker-compose.yml \
#     up -d --build --wait postgres-scratch
#   docker compose --env-file .env -f deploy/compose/backup.restore-test.docker-compose.yml \
#     run --rm restore-test
#
# A DIFFERENT project name from the main stack's `thought-capture`
# (deploy/compose/docker-compose.yml) is the entire safety property this
# file exists for: `postgres-scratch` below has its own Docker volume, and
# that volume lives entirely inside THIS project. Even a completely
# unscoped `docker compose down -v` run against this file cannot reach the
# real dev stack's `postgres-data`/`attachments` volumes, because they are
# not part of this project - not because anyone remembered a flag
# (docs/incidents/0001-docker-compose-down-deleted-the-real-dev-stack.md is
# exactly the failure mode this sidesteps by construction).
name: thought-capture-restore-test

services:
  postgres-scratch:
    image: postgres:18.6-trixie
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thought_capture}
      POSTGRES_USER: ${POSTGRES_USER:-tc_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # No `ports:` - reachable only from restore-test, over this project's
    # own internal network. Nothing here needs a host port at all.
    # No bind-mounted volume, no named volume either: an anonymous volume
    # scoped to this project, created fresh and discarded with the rest of
    # this project's resources at the end of every run - there is nothing
    # here for a teardown to threaten in the first place.
    tmpfs:
      - /var/lib/postgresql:uid=999,gid=999
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tc_migrator} -d ${POSTGRES_DB:-thought_capture}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  restore-test:
    image: postgres:18.6-trixie
    restart: "no"
    depends_on:
      postgres-scratch:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tc_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thought_capture}
    volumes:
      # Read-only: this job proves a backup can be restored, it must never
      # be able to modify the backup it is validating.
      - ${TC_BACKUP_ROOT:-./backups}:/backups:ro
      - ./backup/restore-test.sh:/restore-test.sh:ro
    entrypoint: ["/bin/bash", "/restore-test.sh"]
    security_opt:
      - no-new-privileges:true
