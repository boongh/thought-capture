# Local development stack. See docs/DESIGN.md 13.
#
# Only loopback ports are published. Nothing here is reachable off-host.
#
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml \
#     --profile core up -d --build
#
# `--env-file .env` is required: Compose resolves a bare `.env` relative to this
# file, not the repository root.
#
# Profiles:
#   core          postgres, one-shot migrate, api, discord-bot, worker,
#                 embedding-sidecar (docs/adr/0010) - first-party local
#                 embedding, unlike Khoj below not an optional dependency
#   ai            Khoj and its own database (docs/adr/0003) - a SEPARATE file,
#                 deploy/compose/khoj.docker-compose.yml, passed with a second
#                 `-f`; see that file's own header for why it is not here.
#   backup        one-shot local pg_dump + attachment manifest/copy
#                 (deploy/compose/backup/backup.sh). Restore validation runs
#                 from a SEPARATE file, deploy/compose/
#                 backup.restore-test.docker-compose.yml, against its own
#                 throwaway Postgres under a different project name - see
#                 that file's header for why. Scheduling, off-site
#                 replication, retention tiers, and encryption key custody
#                 (docs/DESIGN.md 14.3/19) remain Phase 3, not built here.
#
# Networks (docs/DESIGN.md 13: "an internal network"; review finding - this
# file previously declared no `networks:` at all, so every service landed on
# Compose's implicit `default` bridge, which has a gateway and full outbound
# NAT):
#   default       unchanged behavior - postgres/migrate/api/discord-bot/
#                 worker/backup, each of which either needs no egress at all
#                 or already needs it (discord-bot -> Discord, worker ->
#                 OpenRouter).
#   embedding     internal: true - no gateway, no egress, no reachability
#                 from outside this Compose project. embedding-sidecar's
#                 entire purpose is to see private document text
#                 (docs/adr/0010 §5) and has no authentication of its own,
#                 so it gets this network and NOTHING else. api/worker -
#                 docs/adr/0010 §5's designated callers, re-confirmed against
#                 the ADR at implementation time - are attached to BOTH
#                 networks: `embedding` to reach the sidecar, `default` for
#                 everything else they already needed it for.
#   deploy/compose/embedding-sidecar.contract-test.docker-compose.yml adds a
#   SECOND, non-internal network to embedding-sidecar ONLY under that overlay
#   (applied only by scripts/check.*/CI's contract-test steps), because an
#   internal-only network silently drops a service's published host port -
#   see that file's own header for the verified detail and why.

name: thought-capture

# ---------------------------------------------------------------------------
# Shared service definitions
# ---------------------------------------------------------------------------

x-service-image: &service-image
  build:
    context: ../..
    dockerfile: Dockerfile
  image: thought-capture:local
  security_opt:
    - no-new-privileges:true

x-service-env: &service-env
  # Inside the network the database is reachable as `postgres`, not as
  # 127.0.0.1 - which from within a container means the container itself. The
  # value in .env is for host tools such as pytest and psql, so it is
  # deliberately overridden here rather than duplicated there.
  TC_DATABASE_URL: >-
    postgresql+psycopg://tc_app:${TC_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-thought_capture}
  TC_APP_DB_PASSWORD: ${TC_APP_DB_PASSWORD}
  TC_WORKSPACE_NAME: ${TC_WORKSPACE_NAME:-personal}
  TC_WORKSPACE_TIMEZONE: ${TC_WORKSPACE_TIMEZONE:-Asia/Bangkok}
  TC_DIGEST_LOCAL_TIME: ${TC_DIGEST_LOCAL_TIME:-20:00}
  TC_DISCORD_BOT_TOKEN: ${TC_DISCORD_BOT_TOKEN}
  TC_DISCORD_OWNER_USER_ID: ${TC_DISCORD_OWNER_USER_ID}
  TC_DISCORD_GUILD_ID: ${TC_DISCORD_GUILD_ID:-}
  TC_DISCORD_CHANNEL_ID: ${TC_DISCORD_CHANNEL_ID:-}
  TC_ATTACHMENT_ROOT: /data/attachments
  TC_ATTACHMENT_MAX_BYTES: ${TC_ATTACHMENT_MAX_BYTES:-26214400}
  # Same pattern as TC_DATABASE_URL above: inside the network Khoj is
  # reachable as `khoj`, on the container's own listening port
  # (deploy/compose/khoj.docker-compose.yml's --port=42110) - not via the
  # separately configurable, loopback-only published port (TC_KHOJ_PORT).
  # The .env value is for host tools (pytest, scripts/check.*) only, so it is
  # deliberately overridden here rather than duplicated there. Harmless when
  # the `ai` profile is not running - HttpKhojClient already degrades an
  # unreachable Khoj the same way regardless of why it is unreachable.
  TC_KHOJ_BASE_URL: http://khoj:42110
  TC_ASK_ENABLED: ${TC_ASK_ENABLED:-false}
  TC_ASK_PROVIDER_RETENTION_ACKNOWLEDGED: ${TC_ASK_PROVIDER_RETENTION_ACKNOWLEDGED:-false}

# LLM configuration (docs/adr/0006). Deliberately a SEPARATE anchor from
# `service-env`, not folded into it: TC_OPENROUTER_API_KEY is a secret, and
# api/migrate have no code path that reads any of these (`apps/api`,
# `tc_worker.bootstrap` never call `tc_infrastructure.llm.factory`) - only
# discord-bot (select, at capture time) and worker (organize, at digest time)
# actually build a provider. Giving the key to containers that cannot use it
# widens the blast radius of a compromised api/migrate container for no
# benefit, so only discord-bot/worker merge this in below.
x-llm-env: &llm-env
  TC_OPENROUTER_API_KEY: ${TC_OPENROUTER_API_KEY:-}
  TC_OPENROUTER_BASE_URL: ${TC_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  TC_MODEL_SELECTION_MODE: ${TC_MODEL_SELECTION_MODE:-safe}
  TC_MODEL_ORGANIZE: ${TC_MODEL_ORGANIZE:-}
  TC_MODEL_SELECT: ${TC_MODEL_SELECT:-}
  TC_MODEL_QUERY_PLAN: ${TC_MODEL_QUERY_PLAN:-}
  TC_MODEL_SUPPORTS_STRICT_SCHEMA: ${TC_MODEL_SUPPORTS_STRICT_SCHEMA:-false}
  TC_MODEL_SELECT_SUPPORTS_STRICT_SCHEMA: ${TC_MODEL_SELECT_SUPPORTS_STRICT_SCHEMA:-false}
  TC_MODEL_ALLOW_FALLBACK: ${TC_MODEL_ALLOW_FALLBACK:-true}
  TC_MODEL_REQUIRE_ZDR: ${TC_MODEL_REQUIRE_ZDR:-false}
  TC_MONTHLY_BUDGET_USD: ${TC_MONTHLY_BUDGET_USD:-5.00}

services:
  postgres:
    # Pinned to a full minor. PostgreSQL recommends always running the current
    # minor. Debian (trixie) rather than Alpine on purpose: musl locale and ICU
    # differences change text collation, which would change full-text and
    # trigram ordering in a system whose correctness depends on retrieval.
    #
    # Built, not pulled directly: deploy/compose/postgres/Dockerfile layers
    # the `pgvector` extension onto this same pinned base (docs/adr/0010 §2).
    # Not a second database server the way Khoj's `khoj-db` was - this project
    # owns and rebuilds this image itself, so there is no external system's
    # base-image requirement to keep separate from.
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: thought-capture-postgres:local
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thought_capture}
      POSTGRES_USER: ${POSTGRES_USER:-tc_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so index ordering is reproducible across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by initdb/01-roles.sh to provision the application role.
      TC_APP_DB_PASSWORD: ${TC_APP_DB_PASSWORD:?TC_APP_DB_PASSWORD must be set in .env}
    ports:
      # Loopback only. Never expose PostgreSQL beyond the host (docs/DESIGN.md 12.2).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory so that
      # `pg_upgrade --link` works without crossing a mount boundary. The mount
      # must therefore be /var/lib/postgresql, not /var/lib/postgresql/data;
      # the older path makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
      # Runs once, at cluster creation only. Changing these scripts has no
      # effect on an existing volume; drop the volume to re-provision.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tc_migrator} -d ${POSTGRES_DB:-thought_capture}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Reduce blast radius: no new privileges, and the image's own postgres user.
    security_opt:
      - no-new-privileges:true

  # One-shot: brings the schema to head and seeds the workspace, both
  # idempotent. Runs with the migration role, before any service starts
  # (docs/DESIGN.md 13). Services wait for it to exit successfully.
  migrate:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_worker.bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      # The migration role owns the schema; the bot never gets this URL.
      TC_MIGRATION_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-tc_migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thought_capture}

  api:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      # Binds to all interfaces *inside* the container; the port below is
      # published only on host loopback, so it is still not reachable off-host
      # (docs/DESIGN.md 12.2).
      TC_API_HOST: "0.0.0.0"
      TC_API_PORT: "8080"
      # Deliberately not `:?`. Compose interpolates every service in the file
      # before starting any of them, so a required variable here would stop
      # `up postgres` from working when only the API is unconfigured. The API
      # entrypoint refuses to start without a token instead, which fails the
      # service that actually needs it rather than the whole stack.
      TC_API_BEARER_TOKEN: ${TC_API_BEARER_TOKEN:-}
    ports:
      - "127.0.0.1:${TC_API_PORT:-8080}:8080"
    volumes:
      - attachments:/data/attachments
    # `default` (unchanged) plus `embedding`: api is one of ADR-0010 §5's
    # designated embedding-sidecar callers (the search-time query embedding
    # path) - see this file's own header networks comment.
    networks: [default, embedding]
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  discord-bot:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_discord_bot"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # select (docs/DESIGN.md 7.3.2) runs at capture time, from this
      # service - see the LLM configuration block's anchor comment above for
      # why api/migrate do not also get `llm-env`.
      <<: [*service-env, *llm-env]
    volumes:
      - attachments:/data/attachments

  # Local embedding (docs/adr/0010 §5): a first-party sidecar wrapping
  # sentence-transformers, its own pinned Python 3.12 image entirely separate
  # from the workspace image built above (`x-service-image`) - torch/
  # sentence-transformers ship no cp314 wheel yet (docs/DESIGN.md 5.2's
  # isolation, previously required of Khoj, now required here too). Holds no
  # index, no conversation state, no filter logic (docs/DESIGN.md 8.1): a
  # stateless embed(texts) -> vectors call, reachable from other `core`
  # services at http://embedding-sidecar:8081 on the internal network.
  #
  # Deliberately NOT published to any host port here, unlike postgres/api
  # above: this service has no authentication of its own (docs/DESIGN.md
  # 8.1) and has an extensive, still-incomplete-by-design DoS-hardening
  # story (settings.py's own `limit_concurrency`/`h11_max_incomplete_event_size`
  # docstrings) - "loopback only" still means "reachable by any process on
  # the host", which is broader than this service actually needs day to
  # day (only other containers on this network do). Nothing yet calls this
  # service (no product-behavior change in this slice); it exists to prove
  # the sidecar itself boots and answers correctly in isolation.
  # `embedding-sidecar.contract-test.docker-compose.yml` is a separate
  # overlay that adds a loopback-published port back, applied only by
  # scripts/check.*/CI's contract-test steps - see that file's own header.
  embedding-sidecar:
    build:
      context: ../../apps/embedding_sidecar
      dockerfile: Dockerfile
    image: thought-capture-embedding-sidecar:local
    profiles: ["core"]
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      # The model is baked into the image at build time (no runtime download),
      # but loading its weights into memory at process start still takes on
      # the order of docs/adr/0010 finding 5's ~30s cold start.
      start_period: 45s
    # Defense in depth alongside the request-level batch/length/concurrency
    # bounds this service enforces itself (settings.py): a container-level
    # ceiling on how much of the host a CPU-bound, unauthenticated-within-
    # the-network embedding process can consume, matching how this repo
    # already treats "loopback only" as a boundary, not the only one.
    mem_limit: ${TC_EMBEDDING_SIDECAR_MEM_LIMIT:-2g}
    cpus: ${TC_EMBEDDING_SIDECAR_CPU_LIMIT:-2.0}
    security_opt:
      - no-new-privileges:true
    # `embedding` ONLY, deliberately not `default` too (review finding: this
    # service previously landed on the implicit `default` bridge, which has
    # a gateway and full outbound NAT - unrestricted egress for a service
    # whose entire purpose is to see private document text). `embedding` is
    # `internal: true` below: no gateway, no egress, reachable only by the
    # other services on this same network (api, worker). See this file's own
    # header networks comment for the contract-test overlay that adds a
    # second, non-internal network for THAT overlay only.
    networks: [embedding]

  # Runs the organize/digest scheduler (docs/DESIGN.md 7.2): wakes at the
  # configured local digest time, catches up any missed window on restart,
  # then organizes each subsequent window as it closes. No published ports -
  # this process only talks to postgres.
  worker:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # organize (docs/DESIGN.md 7.4) runs at digest time, from this service.
      <<: [*service-env, *llm-env]
      # Only worker constructs HttpEmbeddingClient/DeliverEmbeddingSync
      # (apps/worker/src/tc_worker/__main__.py) - api's admin endpoint only
      # enqueues, it never embeds - so these operator-tunable settings
      # (env.example, Settings defaults) are forwarded here only, matching the
      # llm-env pattern above of scoping a variable to the services with an
      # actual code path that reads it. Without this, Compose never injects
      # an arbitrary .env key into a container's runtime environment on its
      # own, so an operator's override in .env would silently have no effect
      # (review finding F12).
      #
      # TC_EMBEDDING_SIDECAR_BASE_URL means "the URL a container uses" - the
      # in-container default below matches Settings' own default
      # (config.py's `embedding_sidecar_base_url`) and env.example documents
      # it with that same service-name value. This is a DIFFERENT variable
      # from TC_EMBEDDING_SIDECAR_HOST_BASE_URL (env.example, read only by
      # tests/contract/embedding_sidecar/conftest.py and both check scripts),
      # which is "the URL the host uses" once the contract-test overlay
      # publishes the port to loopback. One name previously carried both
      # meanings; forwarding it naively here with a loopback default would
      # have injected an unreachable 127.0.0.1 URL into every operator's
      # worker container (review finding F12) - see env.example's own
      # comment on both variables for the full reasoning.
      TC_EMBEDDING_SIDECAR_BASE_URL: ${TC_EMBEDDING_SIDECAR_BASE_URL:-http://embedding-sidecar:8081}
      TC_EMBEDDING_SIDECAR_TIMEOUT_SECONDS: ${TC_EMBEDDING_SIDECAR_TIMEOUT_SECONDS:-30.0}
      TC_EMBEDDING_SYNC_BATCH_SIZE: ${TC_EMBEDDING_SYNC_BATCH_SIZE:-20}
    # `default` (unchanged) plus `embedding`: worker is one of ADR-0010 §5's
    # designated embedding-sidecar callers (the organize-time document
    # embedding write path) - see this file's own header networks comment.
    networks: [default, embedding]

  # One-shot: dumps postgres and copies attachments to a HOST directory
  # (TC_BACKUP_ROOT), never a Docker named volume - deliberately, so a
  # volume-scoped teardown can never take the backup down with it
  # (docs/incidents/0001-docker-compose-down-deleted-the-real-dev-stack.md).
  # Run via scripts/backup.sh/.ps1, not `docker compose up` directly - the
  # wrapper resolves TC_BACKUP_ROOT the same way every time.
  backup:
    # Digest-pinned, not the bare mutable tag (review finding): this
    # service handles the database password and the full plaintext
    # backup/attachment data, so it must not silently pick up whatever
    # `postgres:18.6-trixie` happens to point to on any given day - the
    # same convention deploy/compose/postgres/Dockerfile's own `FROM` line
    # already follows for the image this project builds. Kept in sync with
    # that same digest; see that Dockerfile's own header for how to
    # re-resolve it when the minor version bumps.
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    profiles: ["backup"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tc_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-thought_capture}
      # Forwarded, not defaulted here (review finding): backup.sh's own
      # `copy_complete_timeout_seconds="${TC_BACKUP_COPY_TIMEOUT_SECONDS:-600}"`
      # is the one place that owns "600" as the default, and its own comment
      # there explains why it must be operator-tunable. Without this line the
      # container never saw the host's/`.env`'s value at all - the variable
      # was unset inside the container regardless of what an operator set,
      # so backup.sh's own "raise TC_BACKUP_COPY_TIMEOUT_SECONDS" advice on
      # timeout was a dead end. An empty default here (not `:-600`, which
      # would duplicate that number in two places that could drift)
      # forwards "unset" as "unset" - bash's `:-` fallback treats empty the
      # same as unset, so backup.sh's own default still applies unchanged.
      TC_BACKUP_COPY_TIMEOUT_SECONDS: ${TC_BACKUP_COPY_TIMEOUT_SECONDS:-}
    volumes:
      - ${TC_BACKUP_ROOT:-./backups}:/backups
      - attachments:/data/attachments:ro
      - ./backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "/backup.sh"]
    security_opt:
      - no-new-privileges:true

networks:
  # Declared explicitly so it can be named and referenced by services above -
  # Compose creates this automatically even with no top-level `networks:` key
  # at all, so declaring it here changes nothing about its own behavior.
  default: {}
  # No egress, no gateway, reachable only by services on this project that
  # explicitly join it (docs/DESIGN.md 13). See this file's own header
  # networks comment.
  embedding:
    internal: true

volumes:
  postgres-data:
    driver: local
  attachments:
    driver: local
