# Local development stack. See docs/DESIGN.md 13.
#
# Only loopback ports are published. Nothing here is reachable off-host.
#
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml \
#     --profile core up -d --build
#
# `--env-file .env` is required: Compose resolves a bare `.env` relative to this
# file, not the repository root.
#
# Profiles:
#   core          postgres, one-shot migrate, api, discord-bot, worker
#   ai            Khoj and its own database (docs/adr/0003)
#   backup        one-shot backup and restore-test jobs (Phase 3, not yet defined)

name: thought-capture

# ---------------------------------------------------------------------------
# Shared service definitions
# ---------------------------------------------------------------------------

x-service-image: &service-image
  build:
    context: ../..
    dockerfile: Dockerfile
  image: thought-capture:local
  security_opt:
    - no-new-privileges:true

x-service-env: &service-env
  # Inside the network the database is reachable as `postgres`, not as
  # 127.0.0.1 - which from within a container means the container itself. The
  # value in .env is for host tools such as pytest and psql, so it is
  # deliberately overridden here rather than duplicated there.
  TC_DATABASE_URL: >-
    postgresql+psycopg://tc_app:${TC_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-thought_capture}
  TC_APP_DB_PASSWORD: ${TC_APP_DB_PASSWORD}
  TC_WORKSPACE_NAME: ${TC_WORKSPACE_NAME:-personal}
  TC_WORKSPACE_TIMEZONE: ${TC_WORKSPACE_TIMEZONE:-Asia/Bangkok}
  TC_DIGEST_LOCAL_TIME: ${TC_DIGEST_LOCAL_TIME:-20:00}
  TC_DISCORD_BOT_TOKEN: ${TC_DISCORD_BOT_TOKEN}
  TC_DISCORD_OWNER_USER_ID: ${TC_DISCORD_OWNER_USER_ID}
  TC_DISCORD_GUILD_ID: ${TC_DISCORD_GUILD_ID:-}
  TC_DISCORD_CHANNEL_ID: ${TC_DISCORD_CHANNEL_ID:-}
  TC_ATTACHMENT_ROOT: /data/attachments
  TC_ATTACHMENT_MAX_BYTES: ${TC_ATTACHMENT_MAX_BYTES:-26214400}

services:
  postgres:
    # Pinned to a full minor. PostgreSQL recommends always running the current
    # minor. Debian (trixie) rather than Alpine on purpose: musl locale and ICU
    # differences change text collation, which would change full-text and
    # trigram ordering in a system whose correctness depends on retrieval.
    image: postgres:18.6-trixie
    profiles: ["core"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thought_capture}
      POSTGRES_USER: ${POSTGRES_USER:-tc_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic collation so index ordering is reproducible across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Consumed by initdb/01-roles.sh to provision the application role.
      TC_APP_DB_PASSWORD: ${TC_APP_DB_PASSWORD:?TC_APP_DB_PASSWORD must be set in .env}
    ports:
      # Loopback only. Never expose PostgreSQL beyond the host (docs/DESIGN.md 12.2).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images store data in a major-version subdirectory so that
      # `pg_upgrade --link` works without crossing a mount boundary. The mount
      # must therefore be /var/lib/postgresql, not /var/lib/postgresql/data;
      # the older path makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
      # Runs once, at cluster creation only. Changing these scripts has no
      # effect on an existing volume; drop the volume to re-provision.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tc_migrator} -d ${POSTGRES_DB:-thought_capture}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Reduce blast radius: no new privileges, and the image's own postgres user.
    security_opt:
      - no-new-privileges:true

  # One-shot: brings the schema to head and seeds the workspace, both
  # idempotent. Runs with the migration role, before any service starts
  # (docs/DESIGN.md 13). Services wait for it to exit successfully.
  migrate:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_worker.bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *service-env
      # The migration role owns the schema; the bot never gets this URL.
      TC_MIGRATION_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-tc_migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thought_capture}

  api:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
      # Binds to all interfaces *inside* the container; the port below is
      # published only on host loopback, so it is still not reachable off-host
      # (docs/DESIGN.md 12.2).
      TC_API_HOST: "0.0.0.0"
      TC_API_PORT: "8080"
      # Deliberately not `:?`. Compose interpolates every service in the file
      # before starting any of them, so a required variable here would stop
      # `up postgres` from working when only the API is unconfigured. The API
      # entrypoint refuses to start without a token instead, which fails the
      # service that actually needs it rather than the whole stack.
      TC_API_BEARER_TOKEN: ${TC_API_BEARER_TOKEN:-}
    ports:
      - "127.0.0.1:${TC_API_PORT:-8080}:8080"
    volumes:
      - attachments:/data/attachments
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  discord-bot:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_discord_bot"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env
    volumes:
      - attachments:/data/attachments

  # Runs the organize/digest scheduler (docs/DESIGN.md 7.2): wakes at the
  # configured local digest time, catches up any missed window on restart,
  # then organizes each subsequent window as it closes. No published ports -
  # this process only talks to postgres.
  worker:
    <<: *service-image
    profiles: ["core"]
    command: ["python", "-m", "tc_worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *service-env

  # docs/adr/0003. Khoj's own database - deliberately not sharing the
  # first-party `postgres` server/image: Khoj's reference deployment requires
  # a pgvector-capable build, which would otherwise couple the first-party
  # server's base image to an internal detail of a system this project
  # declares replaceable (docs/DESIGN.md 5 invariant 7).
  khoj-db:
    image: docker.io/pgvector/pgvector:pg15@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: khoj
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: ${TC_KHOJ_DB_PASSWORD:?TC_KHOJ_DB_PASSWORD must be set in .env}
    volumes:
      - khoj-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khoj -d khoj"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # The pinned image ships no non-root user and no config-directory override
  # (khoj/utils/constants.py hardcodes "~/.khoj/..."), so it defaults to root
  # with HOME=/root - review remediation for PR #17. This one-shot step fixes
  # ownership of a fresh volume to the UID the `khoj` service below actually
  # runs as, since a bare-created named volume is root-owned and would
  # otherwise be unwritable to it. It reuses the already-pinned khoj image
  # (rather than adding a second image to pin/track) purely for its coreutils
  # and runs as the image's own default root, deliberately, to be able to
  # chown in the first place; it holds no network access and does nothing
  # else.
  khoj-init:
    image: ghcr.io/khoj-ai/khoj:2.0.0-beta.28@sha256:eb2e44669df44b51cb206b394dc0a00c782ac152dda02c97c9e3dac3d643dbb4
    profiles: ["ai"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /khoj-home/.khoj /khoj-home/.cache && chown -R 1000:1000 /khoj-home"]
    volumes:
      - khoj-home:/khoj-home
    security_opt:
      - no-new-privileges:true

  # docs/adr/0003. Pinned by digest; --anonymous-mode means every request
  # gets Khoj's built-in anonymous user, so this project's own gateway
  # remains the only real authorization boundary - the port is bound to
  # loopback only, matching postgres and the debug UI (docs/adr/0009).
  # Runs as a fixed non-root UID (review remediation for PR #17): the image
  # provides no named non-root user, so an arbitrary UID/GID is used and
  # HOME is redirected to a volume khoj-init has already chowned to match.
  khoj:
    image: ghcr.io/khoj-ai/khoj:2.0.0-beta.28@sha256:eb2e44669df44b51cb206b394dc0a00c782ac152dda02c97c9e3dac3d643dbb4
    profiles: ["ai"]
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      khoj-db:
        condition: service_healthy
      khoj-init:
        condition: service_completed_successfully
    # --log-file is passed explicitly and absolute: khoj/utils/cli.py declares
    # it as `type=pathlib.Path, default="~/.khoj/khoj.log"` and never calls
    # `.expanduser()` on it (unlike khoj's other khoj_dir-derived paths, which
    # do), so the literal default resolves "~" as a directory name, not $HOME.
    # Running as root that accidentally succeeded (root could write it anywhere,
    # including a stray literal "~" folder under the working directory);
    # running as a non-root UID under a read-only /app it fails outright.
    # Confirmed directly against this pinned image, not assumed.
    command:
      [
        "--host=0.0.0.0",
        "--port=42110",
        "--anonymous-mode",
        "--non-interactive",
        "--log-file=/khoj-home/.khoj/khoj.log",
      ]
    environment:
      HOME: /khoj-home
      POSTGRES_DB: khoj
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: ${TC_KHOJ_DB_PASSWORD:?TC_KHOJ_DB_PASSWORD must be set in .env}
      POSTGRES_HOST: khoj-db
      POSTGRES_PORT: "5432"
      KHOJ_DJANGO_SECRET_KEY: ${TC_KHOJ_DJANGO_SECRET_KEY:?TC_KHOJ_DJANGO_SECRET_KEY must be set in .env}
      KHOJ_DEBUG: "False"
      # Admin-panel credentials only (Khoj's own Django admin at /server/admin);
      # not this project's auth boundary and not consumed by any adapter here.
      KHOJ_ADMIN_EMAIL: ${TC_KHOJ_ADMIN_EMAIL:-admin@localhost}
      KHOJ_ADMIN_PASSWORD: ${TC_KHOJ_ADMIN_PASSWORD:?TC_KHOJ_ADMIN_PASSWORD must be set in .env}
      # Self-hosting Khoj specifically to keep personal data local; leaving
      # telemetry on by default would undermine that (docs/adr/0003).
      KHOJ_TELEMETRY_DISABLE: "True"
    ports:
      - "127.0.0.1:${TC_KHOJ_PORT:-42110}:42110"
    volumes:
      - khoj-home:/khoj-home
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    driver: local
  attachments:
    driver: local
  khoj-db-data:
    driver: local
  khoj-home:
    driver: local
