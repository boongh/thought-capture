[project]
name = "tc-worker"
version = "0.1.0"
description = "Scheduler and outbox consumer: capture windows, organization, rebuild, digest dispatch."
requires-python = ">=3.14,<3.15"
dependencies = [
    "tc-domain",
    "tc-application",
    "tc-infrastructure",
    "apscheduler>=3.11,<4",
]

[project.scripts]
tc-worker = "tc_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_worker"]
