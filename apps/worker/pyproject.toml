[project]
name = "tc-worker"
version = "0.1.0"
description = "Migration bootstrap and organization-scheduling building blocks."
requires-python = ">=3.14,<3.15"
dependencies = [
    "tc-domain",
    "tc-application",
    "tc-infrastructure",
    "apscheduler>=3.11,<4",
]

# No [project.scripts] yet; see the note in apps/api/pyproject.toml.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_worker"]
