[project]
name = "tc-discord-bot"
version = "0.1.0"
description = "Discord Gateway transport: capture adapter, acknowledgements, slash commands, digest delivery."
requires-python = ">=3.14,<3.15"
dependencies = [
    "tc-domain",
    "tc-application",
    "tc-infrastructure",
    "discord-py>=2.6",
]

[project.scripts]
tc-discord-bot = "tc_discord_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_discord_bot"]
