[project]
name = "tc-api"
version = "0.1.0"
description = "FastAPI gateway: health, capture, raw log reads, run commands."
requires-python = ">=3.14,<3.15"
dependencies = [
    "tc-domain",
    "tc-application",
    "tc-infrastructure",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
]

[project.scripts]
tc-api = "tc_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_api"]
