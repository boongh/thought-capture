[project]
name = "tc-domain"
version = "0.1.0"
description = "Immutable domain types, policies, and ports. No framework or I/O dependencies."
requires-python = ">=3.14,<3.15"
# Intentionally empty. The domain layer is stdlib-only; see docs/DESIGN.md 5.3.
# tests/unit/test_architecture_boundaries.py enforces this.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_domain"]
