[project]
name = "tc-application"
version = "0.1.0"
description = "Use cases and orchestration: capture, organize, rebuild, restore."
requires-python = ">=3.14,<3.15"
dependencies = [
    "tc-domain",
    "pydantic>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_application"]
