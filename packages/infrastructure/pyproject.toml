[project]
name = "tc-infrastructure"
version = "0.1.0"
description = "Adapters: PostgreSQL, content-addressed blob store, OpenRouter, Discord, Khoj."
requires-python = ">=3.14,<3.15"
dependencies = [
    "tc-domain",
    "tc-application",
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.16",
    "pydantic-settings>=2.8",
    "openai>=1.100",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_infrastructure"]
