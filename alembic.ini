# First-party Alembic history. Khoj owns its own schema and is never touched by
# these migrations (docs/DESIGN.md 5.1).
#
# Migrations run as a one-shot deployment step, never from API startup
# (docs/DESIGN.md 13). The database URL is supplied by migrations/env.py from
# TC_MIGRATION_DATABASE_URL so that credentials stay out of this file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Zero-padded, ordered revision files: 0001_..., 0002_...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
