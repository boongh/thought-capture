# Continuous integration for first-party services (docs/DESIGN.md 16).
#
# The steps here mirror scripts/check.sh so that a green local run and a green
# CI run mean the same thing. Steps 1, 7, and 8 of the design's CI list (secret
# scanning, OCI image build with SBOM, vulnerability scan) arrive with Phase 3
# hardening; everything currently implementable runs on every change.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches deploy/compose/docker-compose.yml. Local-only throwaway values:
  # CI never sees production credentials.
  POSTGRES_DB: thought_capture
  POSTGRES_USER: tc_migrator
  POSTGRES_PASSWORD: tc_migrator
  TC_APP_DB_PASSWORD: tc_app
  # Khoj's own database/admin credentials (docs/adr/0003, 'ai' compose
  # profile). Also throwaway: Khoj is loopback-only and torn down at the end
  # of this job.
  TC_KHOJ_DB_PASSWORD: tc_khoj_db
  TC_KHOJ_DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  TC_KHOJ_ADMIN_PASSWORD: tc_khoj_admin

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same full minor as the local compose stack. A different
        # minor here would mean CI is not testing what developers run.
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: thought_capture
          POSTGRES_USER: tc_migrator
          POSTGRES_PASSWORD: tc_migrator
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tc_migrator -d thought_capture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the pinned CPython
        run: uv python install

      - name: Sync the workspace
        # --frozen fails if uv.lock is not in sync with the pyproject files,
        # which is the dependency-metadata validation the design asks for.
        run: uv sync --all-packages --frozen

      - name: Build and smoke-test the custom Postgres image (docs/adr/0010 §2)
        # The step below patches the *stock* `postgres:18.6-trixie` services
        # container (started before any step ran) rather than building
        # deploy/compose/postgres/Dockerfile - a bug in that Dockerfile
        # itself (a bad ARG, a broken RUN step, a base-image reference typo)
        # would otherwise never be exercised anywhere in CI and could merge
        # green. This actually builds it and proves the resulting image
        # boots and serves `CREATE EXTENSION vector`, independent of (and in
        # addition to) the patched services container the rest of this job
        # uses for migration/integration testing.
        run: |
          docker build -t thought-capture-postgres:ci -f deploy/compose/postgres/Dockerfile deploy/compose/postgres
          docker run -d --name pg-smoke -e POSTGRES_PASSWORD=ci-smoke-only thought-capture-postgres:ci
          for _ in $(seq 1 20); do
            if docker exec pg-smoke pg_isready -U postgres >/dev/null 2>&1; then
              echo "Custom Postgres image is ready"
              break
            fi
            sleep 1
          done
          docker exec pg-smoke psql -U postgres -c "CREATE EXTENSION vector; SELECT '[1,2,3]'::vector;"
          docker rm -f pg-smoke

      - name: Install pgvector into the CI Postgres service
        # GitHub Actions `services:` containers are started from a pulled
        # image before any step runs, so they cannot be the custom image
        # deploy/compose/postgres/Dockerfile builds (docs/adr/0010 §2) the
        # way a developer's `docker compose --profile core up --build`
        # already is. This installs the identical pinned apt package that
        # Dockerfile installs, into the same already-running base image, so
        # migration 0008's `CREATE EXTENSION vector` has something to find -
        # functionally the same result, without building via compose for
        # this one service. The version is read from the Dockerfile's own
        # ARG default, not duplicated here as a second literal that could
        # drift out of sync with it on a future bump.
        run: |
          pgvector_version="$(grep -oE 'PGVECTOR_PACKAGE_VERSION=\S+' deploy/compose/postgres/Dockerfile | cut -d= -f2)"
          echo "Installing postgresql-18-pgvector=${pgvector_version} (from deploy/compose/postgres/Dockerfile)"
          container_id="$(docker ps --filter publish=5432 --format '{{.ID}}')"
          docker exec "$container_id" bash -c \
            "apt-get update && apt-get install -y --no-install-recommends postgresql-18-pgvector=${pgvector_version}"

      - name: Provision the application role
        # Runs the same script the compose stack runs at cluster creation, so a
        # bug in it fails CI rather than surfacing on a developer's machine.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: bash deploy/compose/initdb/01-roles.sh

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration and not contract"

      # -----------------------------------------------------------------
      # apps/embedding_sidecar carries its own toolchain (Python 3.12, own
      # pyproject.toml/uv.lock - docs/adr/0010 §5), excluded from the root
      # uv workspace above, so none of the steps so far ever touch it. This
      # mirrors scripts/check.sh's own "embedding sidecar: ..." steps, per
      # this file's header ("mirrors scripts/check.sh so that a green local
      # run and a green CI run mean the same thing").
      # -----------------------------------------------------------------
      - name: Install the sidecar's own pinned CPython
        working-directory: apps/embedding_sidecar
        run: uv python install

      - name: Sync the sidecar's own workspace
        working-directory: apps/embedding_sidecar
        run: uv sync --frozen

      - name: Embedding sidecar - format
        working-directory: apps/embedding_sidecar
        run: uv run ruff format --check .

      - name: Embedding sidecar - lint
        working-directory: apps/embedding_sidecar
        run: uv run ruff check .

      - name: Embedding sidecar - types
        working-directory: apps/embedding_sidecar
        run: uv run mypy

      - name: Embedding sidecar - unit tests
        working-directory: apps/embedding_sidecar
        run: uv run pytest

      - name: Integration tests
        # TC_REQUIRE_INTEGRATION turns a skip into a failure, so an unreachable
        # database cannot be reported as a passing suite.
        env:
          TC_REQUIRE_INTEGRATION: "1"
        run: uv run pytest -m integration

      - name: Backup and restore validation
        # docs/incidents/0001-docker-compose-down-deleted-the-real-dev-
        # stack.md: proves scripts/backup.sh's dump can actually be
        # restored, not merely that pg_dump exits 0. Brings up its own
        # throwaway project on port 15498 - the postgres `services:`
        # container above already occupies 5432 for the rest of this job,
        # and scripts/check-backup-restore.sh's own header explains why it
        # does not reuse scripts/backup.sh/restore-test.sh (which
        # intentionally target the real `thought-capture` project) directly.
        run: scripts/check-backup-restore.sh

      # -----------------------------------------------------------------
      # Khoj contract tests (docs/DESIGN.md 16 step 6, docs/adr/0003).
      #
      # Unlike postgres above (a GitHub Actions `services:` container, up
      # for the whole job), Khoj is started here via the real 'ai' compose
      # profile so CI exercises the same topology (khoj + its own khoj-db)
      # a developer runs locally - not a hand-rolled substitute. This was
      # previously entirely missing: scripts/check.ps1 and check.sh treat an
      # unreachable Khoj as a skip for local developer convenience, but nothing
      # started Khoj in CI, so that skip was silently absorbing every commit
      # instead of the "pinned Khoj contract smoke test" the design requires.
      # TC_REQUIRE_CONTRACT makes the same skip a hard failure here, matching
      # how TC_REQUIRE_INTEGRATION already does for the database above.
      # -----------------------------------------------------------------
      - name: Start the stub chat model
        # tests/contract/khoj/stub_chat_model.py: a minimal OpenAI-compatible
        # server so Khoj's own first-boot chat-model registration has a real
        # (if fake) target to configure - without it, Khoj's chat interface
        # stays unconfigured and the chat contract tests below would only be
        # exercising the "not configured" degraded path, never a real answer.
        run: |
          nohup uv run uvicorn tests.contract.khoj.stub_chat_model:app \
            --host 0.0.0.0 --port 8899 > stub-chat-model.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:8899/v1/models >/dev/null 2>&1; then
              echo "Stub chat model is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Stub chat model did not become ready in time" >&2
          cat stub-chat-model.log >&2
          exit 1

      - name: Start Khoj ('ai' compose profile)
        # TC_KHOJ_OPENAI_* points Khoj's own first-boot chat-model setup
        # (khoj.utils.initialization._create_chat_configuration) at the stub
        # above instead of leaving the chat interface unconfigured -
        # host-gateway/host.docker.internal is what lets the khoj container
        # reach a server running on the runner itself (deploy/compose/
        # khoj.docker-compose.yml's `extra_hosts` on the khoj service).
        env:
          TC_KHOJ_OPENAI_BASE_URL: http://host.docker.internal:8899/v1
          TC_KHOJ_OPENAI_API_KEY: stub-key
        run: |
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/khoj.docker-compose.yml \
            --profile ai up -d khoj-db khoj-init khoj

      - name: Wait for Khoj to become ready
        run: |
          for _ in $(seq 1 40); do
            if curl --silent --fail --max-time 3 "http://127.0.0.1:42110/api/search?q=check" >/dev/null 2>&1; then
              echo "Khoj is ready"
              exit 0
            fi
            sleep 3
          done
          echo "Khoj did not become ready in time" >&2
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/khoj.docker-compose.yml \
            --profile ai logs khoj
          exit 1

      - name: Preflight - Khoj can reach the stub chat model
        # Confirms the network path the chat contract tests depend on (the
        # khoj container reaching host.docker.internal:8899, where the stub
        # above listens) actually works, and fails clearly here instead of
        # surfacing only as a missing answer + a failed cleanup DELETE in the
        # contract tests. Runs from inside the khoj container itself, the
        # same path Khoj's own outbound chat-model requests take (docs/adr/0003
        # finding 4). Uses python3, already present in the pinned Khoj image,
        # rather than curl, which is not guaranteed to be. Prints only
        # success/failure, never the stub's response body.
        run: |
          if ! docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/khoj.docker-compose.yml \
            --profile ai exec -T khoj python3 -c \
            "import urllib.request; urllib.request.urlopen('http://host.docker.internal:8899/v1/models', timeout=5)"; then
            echo "khoj container cannot reach the stub chat model at http://host.docker.internal:8899/v1/models" >&2
            exit 1
          fi
          echo "OK: khoj container can reach the stub chat model"

      # -----------------------------------------------------------------
      # Embedding sidecar contract tests (docs/adr/0010 §5).
      #
      # First-party and part of the 'core' compose profile, not an optional
      # add-on the way Khoj/'ai' is - started the same way ('core' profile,
      # not a hand-rolled substitute), so a Dockerfile bug in
      # apps/embedding_sidecar/Dockerfile fails CI too.
      # -----------------------------------------------------------------
      - name: Start the embedding sidecar ('core' compose profile)
        # The contract-test overlay is what publishes this service to a
        # host port at all - deploy/compose/docker-compose.yml deliberately
        # does not, for normal use (that file's own header comment on
        # `embedding-sidecar` has the full reasoning). Without this second
        # `-f`, this step would start a sidecar this job could never reach
        # from the runner's own `curl`/`pytest` below.
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            -f deploy/compose/embedding-sidecar.contract-test.docker-compose.yml \
            --profile core up -d --build embedding-sidecar

      - name: Wait for the embedding sidecar to become ready
        run: |
          for _ in $(seq 1 40); do
            if curl --silent --fail --max-time 3 "http://127.0.0.1:8081/health" >/dev/null 2>&1; then
              echo "Embedding sidecar is ready"
              exit 0
            fi
            sleep 3
          done
          echo "Embedding sidecar did not become ready in time" >&2
          docker compose -f deploy/compose/docker-compose.yml \
            -f deploy/compose/embedding-sidecar.contract-test.docker-compose.yml \
            --profile core logs embedding-sidecar
          exit 1

      - name: Contract tests
        env:
          TC_REQUIRE_CONTRACT: "1"
        run: uv run pytest -m contract

      - name: Stop the embedding sidecar
        # `down`, not `stop`: nothing else from 'core' was started via
        # compose in this job (postgres above is the native `services:`
        # container, not compose-managed), so tearing down the whole
        # project here is scoped to exactly what this job itself started.
        if: always()
        run: |
          docker compose -f deploy/compose/docker-compose.yml \
            -f deploy/compose/embedding-sidecar.contract-test.docker-compose.yml \
            --profile core down -v

      - name: Stop Khoj
        if: always()
        run: |
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/khoj.docker-compose.yml \
            --profile ai down -v

      # Regression check for the review finding that the 'ai' profile's
      # required TC_KHOJ_* variables were breaking a Khoj-less 'core'
      # deployment (review remediation, PR #17): 'core' must validate with
      # zero TC_KHOJ_* configuration, and 'ai' must still fail clearly - not
      # silently - when its own secrets are absent.
      - name: Compose config sanity - core is independent of Khoj secrets
        env:
          TC_KHOJ_DB_PASSWORD: ""
          TC_KHOJ_DJANGO_SECRET_KEY: ""
          TC_KHOJ_ADMIN_PASSWORD: ""
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile core config --quiet

      - name: Compose config sanity - ai fails clearly without its secrets
        env:
          TC_KHOJ_DB_PASSWORD: ""
          TC_KHOJ_DJANGO_SECRET_KEY: ""
          TC_KHOJ_ADMIN_PASSWORD: ""
        run: |
          if docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/khoj.docker-compose.yml \
            --profile ai config --quiet 2>/tmp/ai-config-error; then
            echo "expected 'ai' config to fail without TC_KHOJ_* set, but it succeeded" >&2
            exit 1
          fi
          if ! grep -q "TC_KHOJ_" /tmp/ai-config-error; then
            echo "'ai' config failed, but not for a missing TC_KHOJ_* variable:" >&2
            cat /tmp/ai-config-error >&2
            exit 1
          fi
          echo "OK: ai profile fails clearly without Khoj secrets:"
          cat /tmp/ai-config-error

      - name: Reject tracked environment files
        # A committed .env would leak credentials; fail loudly rather than warn.
        run: |
          tracked="$(git ls-files '.env' '.env.*')"
          if [ -n "$tracked" ]; then
            echo "Refusing to pass: environment file(s) are tracked: $tracked" >&2
            exit 1
          fi
