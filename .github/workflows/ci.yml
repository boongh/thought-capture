# Continuous integration for first-party services (docs/DESIGN.md 16).
#
# The steps here mirror scripts/check.sh so that a green local run and a green
# CI run mean the same thing. Steps 1, 7, and 8 of the design's CI list (secret
# scanning, OCI image build with SBOM, vulnerability scan) arrive with Phase 3
# hardening; everything currently implementable runs on every change.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches deploy/compose/docker-compose.yml. Local-only throwaway values:
  # CI never sees production credentials.
  POSTGRES_DB: thought_capture
  POSTGRES_USER: tc_migrator
  POSTGRES_PASSWORD: tc_migrator
  TC_APP_DB_PASSWORD: tc_app

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same full minor as the local compose stack. A different
        # minor here would mean CI is not testing what developers run.
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: thought_capture
          POSTGRES_USER: tc_migrator
          POSTGRES_PASSWORD: tc_migrator
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tc_migrator -d thought_capture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the pinned CPython
        run: uv python install

      - name: Sync the workspace
        # --frozen fails if uv.lock is not in sync with the pyproject files,
        # which is the dependency-metadata validation the design asks for.
        run: uv sync --all-packages --frozen

      - name: Provision the application role
        # Runs the same script the compose stack runs at cluster creation, so a
        # bug in it fails CI rather than surfacing on a developer's machine.
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: bash deploy/compose/initdb/01-roles.sh

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest -m "not integration and not contract"

      - name: Integration tests
        # TC_REQUIRE_INTEGRATION turns a skip into a failure, so an unreachable
        # database cannot be reported as a passing suite.
        env:
          TC_REQUIRE_INTEGRATION: "1"
        run: uv run pytest -m integration

      - name: Reject tracked environment files
        # A committed .env would leak credentials; fail loudly rather than warn.
        run: |
          tracked="$(git ls-files '.env' '.env.*')"
          if [ -n "$tracked" ]; then
            echo "Refusing to pass: environment file(s) are tracked: $tracked" >&2
            exit 1
          fi
